<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloated — Loading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000 url('./splash.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    /* dark overlay so green text is readable */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
    }
    #log-container {
      position: relative;
      z-index: 1;
      padding: 16px 20px 20px;
      max-height: 40vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    #log {
      color: #00ff41;
      font-size: 12px;
      line-height: 1.6;
      text-shadow: 0 0 6px rgba(0, 255, 65, 0.4);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      background: #00ff41;
      animation: blink 0.8s step-end infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    #progress-bar {
      position: relative;
      z-index: 1;
      margin: 0 20px 20px;
      height: 5px;
      background: rgba(0, 255, 65, 0.2);
      border: 1px solid rgba(0, 255, 65, 0.5);
      border-radius: 3px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6c5ce7, #a855f7);
      box-shadow: 0 0 10px rgba(108, 92, 231, 0.7);
      border-radius: 3px;
      transition: width 0.35s ease;
    }
  </style>
</head>
<body>
  <div id="log-container">
    <div id="log"></div>
    <span class="cursor"></span>
  </div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <script>
    const { ipcRenderer } = require('electron');
    const logEl = document.getElementById('log');
    const fillEl = document.getElementById('progress-fill');

    ipcRenderer.on('splash:log', (_event, msg) => {
      logEl.textContent += msg + '\n';
      // auto-scroll: keep only last ~20 lines visible
      const lines = logEl.textContent.split('\n');
      if (lines.length > 25) {
        logEl.textContent = lines.slice(-25).join('\n');
      }
    });

    ipcRenderer.on('splash:progress', (_event, pct) => {
      fillEl.style.width = pct + '%';
    });
  </script>
</body>
</html>
